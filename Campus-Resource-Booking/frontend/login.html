<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Campus Resource Booking</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar" aria-label="Main navigation">
        <a class="navbar__brand" href="index.html">Campus Resource Booking</a>
        <button class="navbar__toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <ul class="navbar__links">
          <!-- Shown while logged out -->
          <li data-auth="guest"><a href="resources.html">Resources</a></li>
          <li data-auth="guest"><a href="register.html">Register</a></li>

          <!-- Shown while logged in -->
          <li data-auth="user" hidden><a href="dashboard.html">Dashboard</a></li>
          <li data-auth="user" hidden><a href="resources.html">Resources</a></li>
          <li data-auth="user" hidden><a href="my-bookings.html">All Bookings</a></li>
          <li data-auth="user" data-auth-role="admin" hidden><a href="admin.html">Admin</a></li>
          <li data-auth="user" hidden>
            <span class="navbar__user" data-auth-user-name></span>
          </li>
          <li data-auth="user" hidden><button class="navbar__logout" type="button" id="logout-button">Logout</button></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="auth-section" aria-labelledby="login-title">
        <h1 id="login-title">Login</h1>

        <!-- Shown when a request bounced the user here (expired token, guest, etc.) -->
        <div id="auth-notice" class="message" aria-live="polite" hidden></div>
        <!-- Success / loading / error feedback for the login request -->
        <div id="auth-message" class="message" aria-live="polite" hidden></div>

        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button type="submit">Login</button>
        </form>
      </section>
    </main>

        <script src="js/main.js"></script>
        <script src="js/config.js"></script>
        <script src="js/api.js"></script>
        <script src="js/ui.js"></script>
        <script src="js/auth.js"></script>
     </body>
    </html>
